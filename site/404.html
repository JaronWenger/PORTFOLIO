<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Jaron Wenger</title>
  <meta name="theme-color" content="#0c1411">
  <link rel="icon" type="image/svg+xml" href="/images/jw-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/jw-icon-32.png">
  <style>
    /* Same colors as the landing page (site/index.html) */
    :root {
      --dark: #0c1411;
      --on-dark: #f2f5f3;
      --on-dark-muted: #9aa8a1;
      --glow: #3fcf8e;
      --glow-ink: #04140c;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;
      background: var(--dark); color: var(--on-dark); text-align: center;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .code { margin: 0 0 12px; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--glow); }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; letter-spacing: -0.03em; font-weight: 750; }
    p { margin: 0 0 32px; color: var(--on-dark-muted); }
    .btn {
      display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px;
      background: var(--glow); color: var(--glow-ink); font-weight: 650; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a class="btn" href="/">Go to the homepage</a>
  </main>
</body>
</html>
